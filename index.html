
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Progressive Web App Meta Tags -->

    <meta name="theme-color" content="#10B981" />

    <meta name="keywords" content="couples therapy, relationship advice, communication, AI counseling, HeartBridge" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Favicons and Icons -->
    <link rel="icon" type="image/svg+xml" href="/icons/heart-bridge-32.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/heart-bridge-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/heart-bridge-16.png" />
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/heart-bridge-180.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/heart-bridge-152.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/icons/heart-bridge-144.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/heart-bridge-120.png" />
    
    <!-- iOS Safari Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HeartBridge" />
    
    <!-- Android Chrome Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Microsoft Tiles -->
    <meta name="msapplication-TileColor" content="#10B981" />
    <meta name="msapplication-TileImage" content="/icons/heart-bridge-144.png" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://heartbridge.app/" />
    <meta property="og:title" content="AI HeartBridge - Couples Communication Platform" />
    <meta property="og:description" content="AI-powered platform for couples to strengthen their relationship through guided communication, exercises, and insights." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:alt" content="AI HeartBridge - Couples Communication Platform" />
    <meta property="og:site_name" content="AI HeartBridge" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://heartbridge.app/" />
    <meta name="twitter:title" content="AI HeartBridge - Couples Communication Platform" />
    <meta name="twitter:description" content="AI-powered platform for couples to strengthen their relationship through guided communication, exercises, and insights." />
    <meta name="twitter:image" content="/twitter-image.png" />
    <meta name="twitter:image:alt" content="AI HeartBridge Platform" />
    
    <!-- Fonts and Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet" />
    
    <!-- Preload critical resources -->
    <!-- Removed unused preload to prevent console warnings -->
    
    <!-- Security -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    
    <style>
      /* Critical CSS for immediate render */
      :root {
        --primary-color: #10B981;
        --secondary-color: #6B73FF;
        --background: #ffffff;
        --foreground: #1f2937;
      }
      
      * {
        box-sizing: border-box;
      }
      
      body {
        margin: 0;
        padding: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.6;
        color: var(--foreground);
        background: var(--background);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        overflow-x: hidden;
      }
      
      #root {
        min-height: 100vh;
        min-height: 100dvh; /* Dynamic viewport height for mobile */
      }
      
      /* Safe area for mobile devices */
      .safe-area-top { padding-top: env(safe-area-inset-top); }
      .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom); }
      .safe-area-left { padding-left: env(safe-area-inset-left); }
      .safe-area-right { padding-right: env(safe-area-inset-right); }
      
      /* Smooth scrolling */
      html {
        scroll-behavior: smooth;
      }
      
      /* Focus styles for accessibility */
      :focus {
        outline: 2px solid var(--primary-color);
        outline-offset: 2px;
      }
      
      /* High contrast mode support */
      @media (prefers-contrast: high) {
        :root {
          --primary-color: #000000;
          --background: #ffffff;
          --foreground: #000000;
        }
      }
      
      /* Dark mode support */
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #111827;
          --foreground: #f9fafb;
        }
        
        body {
          background: var(--background);
          color: var(--foreground);
        }
      }
      
      /* Reduced motion support */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.25.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.3.0"
  }
}
</script>
</head>
  <body>
    <!-- Development Tools Notice -->
    <div id="dev-notice" style="display: none; position: fixed; top: 10px; right: 10px; background: #1f2937; color: #10b981; padding: 8px 12px; border-radius: 6px; font-size: 12px; z-index: 10000; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
      <span>🛠️ Dev Mode | </span>
      <a href="https://react.dev/link/react-devtools" target="_blank" style="color: #3b82f6; text-decoration: underline;">Install React DevTools</a>
    </div>
    
    <!-- Main App -->
    <div id="root" class="safe-area-top safe-area-bottom safe-area-left safe-area-right"></div>
    
    <!-- Service Worker Registration -->
    <script>
      // Development environment detection and tools
      const isDev = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      
      if (isDev) {
        // Show development notice
        const devNotice = document.getElementById('dev-notice');
        if (devNotice) {
          devNotice.style.display = 'block';
          
          // Auto-hide after 10 seconds
          setTimeout(() => {
            devNotice.style.opacity = '0';
            devNotice.style.transition = 'opacity 0.5s';
            setTimeout(() => devNotice.remove(), 500);
          }, 10000);
        }
        
        // Enhanced development logging
        console.log('%c💙 AI HeartBridge - Development Mode', 'color: #10b981; font-size: 16px; font-weight: bold;');
        console.log('%cReact DevTools: https://react.dev/link/react-devtools', 'color: #3b82f6;');
        console.log('%cTanStack Query DevTools: Available in app', 'color: #ff6b6b;');
        
        // Performance monitoring in development
        if ('performance' in window) {
          window.addEventListener('load', () => {
            setTimeout(() => {
              const perfData = performance.getEntriesByType('navigation')[0];
              if (perfData) {
                console.group('%c⚡ Performance Metrics', 'color: #f59e0b; font-weight: bold;');
                console.log(`DOM Content Loaded: ${Math.round(perfData.domContentLoadedEventEnd - perfData.domContentLoadedEventStart)}ms`);
                console.log(`Page Load Complete: ${Math.round(perfData.loadEventEnd - perfData.loadEventStart)}ms`);
                console.log(`Total Load Time: ${Math.round(perfData.loadEventEnd - perfData.fetchStart)}ms`);
                console.groupEnd();
              }
            }, 0);
          });
        }
        
        // React DevTools detection
        setTimeout(() => {
          if (typeof window.__REACT_DEVTOOLS_GLOBAL_HOOK__ !== 'undefined') {
            console.log('%c✅ React DevTools detected and active', 'color: #10b981;');
          } else {
            console.log('%c⚠️ React DevTools not detected. Install for better debugging:', 'color: #f59e0b;');
            console.log('%chttps://react.dev/link/react-devtools', 'color: #3b82f6;');
          }
        }, 2000);
        
        // Onboarding data logging helper
        window.logOnboardingData = (data) => {
          console.group('%c📝 Onboarding Data Analysis', 'color: #8b5cf6; font-weight: bold;');
          console.log('%cPersonal Info:', 'color: #3b82f6; font-weight: bold;', data.personalInfo);
          console.log('%cRelationship Info:', 'color: #10b981; font-weight: bold;', data.relationshipInfo);
          console.log('%cGoals:', 'color: #f59e0b; font-weight: bold;', data.goals);
          console.log('%cChallenges:', 'color: #ef4444; font-weight: bold;', data.challenges);
          console.log('%cPreferences:', 'color: #8b5cf6; font-weight: bold;', data.preferences);
          console.groupEnd();
        };
        
        // Database save tracking
        window.logDatabaseSave = (operation, data, success = true) => {
          const emoji = success ? '✅' : '❌';
          const color = success ? '#10b981' : '#ef4444';
          console.log(`%c${emoji} Database ${operation}`, `color: ${color}; font-weight: bold;`, data);
        };
      }
      
      // Hide loading screen once page is loaded
      window.addEventListener('load', () => {
        // The loading screen is now handled by GorgeousLoader in React
      });
      
      // Register service worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered: ', registration);
              
              // Check for updates
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      // New content is available, prompt user to refresh
                      if (confirm('New version available! Refresh to update?')) {
                        window.location.reload();
                      }
                    }
                  });
                }
              });
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
      
      // Handle app install prompt
      let deferredPrompt;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        
        // Show install button or notification
        console.log('App can be installed');
      });
      
      // Track app usage analytics
      window.addEventListener('appinstalled', () => {
        console.log('HeartBridge app was installed');
        deferredPrompt = null;
      });
      
      // Handle network status changes
      window.addEventListener('online', () => {
        console.log('App is online');
        document.body.classList.remove('offline');
      });
      
      window.addEventListener('offline', () => {
        console.log('App is offline');
        document.body.classList.add('offline');
      });
    </script>
    
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
